  <!-- Firebase SDK 모듈 로드 -->

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      onSnapshot, 
      doc, 
      setDoc, 
      deleteDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD38PlIfxBCv8xEALFa8beeFxT0q7PMXTA",
      authDomain: "planfairy.firebaseapp.com",
      projectId: "planfairy",
      storageBucket: "planfairy.firebasestorage.app",
      messagingSenderId: "835649965679",
      appId: "1:835649965679:web:27a83d28692bc807aac79a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 글로벌 객체로 전송하여 React에서 참조 가능하도록 설정
    window.db = db;
    window.dbFunctions = { collection, onSnapshot, doc, setDoc, deleteDoc };

<body class="bg-gray-100 min-h-screen p-4 sm:p-6 text-gray-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const initialFormState = {
      storeName: '',
      titleKeyword: '',
      bodyKeyword: '',
      requestNote: '',
      productName: '',
      bodySource: '',
      hashtags: '',
      link: '',
      location: '',
      operatingHours: '',
      storeIntro: '',
      directions: '',
      parking: '',
      reservation: '',
      menu: '',
      purpose: '',
      parkingInfo: '',
      roomType: '',
      amenities: ''
    };

    function App() {
      const [activeTab, setActiveTab] = useState('editor'); // editor, list, stats
      const [platform, setPlatform] = useState('instagram');
      const [category, setCategory] = useState('product');

      const [listFilter, setListFilter] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [savedPosts, setSavedPosts] = useState([]);

      const [formData, setFormData] = useState(initialFormState);
      const [generatedResult, setGeneratedResult] = useState('');
      const [generatedPhotoList, setGeneratedPhotoList] = useState([]);
      const [lastAutoSaveTime, setLastAutoSaveTime] = useState('');

      // 팔로우 통계 관련 State
      const [followHistory, setFollowHistory] = useState([]);
      const [inputFollower, setInputFollower] = useState('');
      const [inputFollowing, setInputFollowing] = useState('');
      const [inputDate, setInputDate] = useState(new Date().toISOString().split('T')[0]);
      
      const [statsPeriod, setStatsPeriod] = useState('week');

      // Firebase Firestore 실시간 연동 (스마트폰/PC 공유)
      useEffect(() => {
        const checkDbTimer = setInterval(() => {
          if (window.db && window.dbFunctions) {
            clearInterval(checkDbTimer);
            const { collection, onSnapshot } = window.dbFunctions;

            // 1. 초안 저장 목록 실시간 동기화
            const postsRef = collection(window.db, "savedPosts");
            onSnapshot(postsRef, (snapshot) => {
              const postsData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              postsData.sort((a, b) => (b.id - a.id));
              setSavedPosts(postsData);
            }, (error) => console.error("Firebase Posts 불러오기 오류:", error));

            // 2. 팔로우 통계 실시간 동기화
            const statsRef = collection(window.db, "followStats");
            onSnapshot(statsRef, (snapshot) => {
              const statsData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              statsData.sort((a, b) => new Date(b.date) - new Date(a.date));
              setFollowHistory(statsData);
            }, (error) => console.error("Firebase Stats 불러오기 오류:", error));
          }
        }, 100);

        return () => clearInterval(checkDbTimer);
      }, []);

      const formDataRef = useRef(formData);
      const platformRef = useRef(platform);
      const categoryRef = useRef(category);

      useEffect(() => {
        formDataRef.current = formData;
        platformRef.current = platform;
        categoryRef.current = category;
      }, [formData, platform, category]);

      // 3분 주기의 작성 중 임시 자동저장 (기기 로컬 보관)
      useEffect(() => {
        const interval = setInterval(() => {
          const hasContent = Object.values(formDataRef.current).some(val => val.trim() !== '');
          if (hasContent) {
            const nowTime = new Date().toLocaleTimeString('ko-KR');
            const draftData = {
              formData: formDataRef.current,
              platform: platformRef.current,
              category: categoryRef.current,
              savedAt: nowTime
            };
            try {
              localStorage.setItem('BLOG_MANAGER_DRAFT_FORM', JSON.stringify(draftData));
              setLastAutoSaveTime(nowTime);
            } catch (e) {
              console.error('자동저장 실패:', e);
            }
          }
        }, 180000);

        return () => clearInterval(interval);
      }, []);

      const savePostToFirebase = async (post) => {
        if (!window.db || !window.dbFunctions) return;
        const { doc, setDoc } = window.dbFunctions;
        try {
          await setDoc(doc(window.db, "savedPosts", String(post.id)), post);
        } catch (e) {
          console.error("Firebase 저장 실패:", e);
        }
      };

      const deletePostFromFirebase = async (id) => {
        if (!window.db || !window.dbFunctions) return;
        const { doc, deleteDoc } = window.dbFunctions;
        try {
          await deleteDoc(doc(window.db, "savedPosts", String(id)));
        } catch (e) {
          console.error("Firebase 삭제 실패:", e);
        }
      };

      const handleChange = (key, value) => {
        setFormData(prev => ({ ...prev, [key]: value }));
      };

      const handleClearForm = () => {
        if (confirm('작성 중인 입력폼 내용만 초기화하시겠습니까? (저장 목록은 유지됩니다)')) {
          setFormData(initialFormState);
          setGeneratedResult('');
          setGeneratedPhotoList([]);
          setLastAutoSaveTime('');
        }
      };

      const extractWords = (str) => {
        if (!str) return [];
        return str.split(/[\s,]+/).map(w => w.trim().replace(/^#/, '')).filter(Boolean);
      };

      const formatOperatingHours = (rawText) => {
        if (!rawText.trim()) return '';
        const lines = rawText.split('\n');
        const dayTimes = [];

        lines.forEach(line => {
          if (line.includes('브레이크') || line.includes('Break') || line.includes('라스트오더')) return;
          const match = line.match(/(월|화|수|목|금|토|일|매일|평일|주말)[^\d]*(\d{1,2}:\d{2}\s*[-~]\s*\d{1,2}:\d{2})/);
          if (match) {
            dayTimes.push({ day: match[1], time: match[2].replace(/\s+/g, '') });
          } else if (line.includes(':')) {
            const cleanLine = line.replace(/브레이크타임.*$/g, '').trim();
            if (cleanLine) dayTimes.push({ day: '', time: cleanLine });
          }
        });

        if (dayTimes.length === 0) return rawText.trim();

        const timeGrouped = {};
        dayTimes.forEach(item => {
          if (!timeGrouped[item.time]) timeGrouped[item.time] = [];
          if (item.day && !timeGrouped[item.time].includes(item.day)) {
            timeGrouped[item.time].push(item.day);
          }
        });

        let resultLines = [];
        for (const [time, days] of Object.entries(timeGrouped)) {
          if (days.length > 1) {
            resultLines.push(`${days[0]}~${days[days.length - 1]}: ${time}`);
          } else if (days.length === 1) {
            resultLines.push(`${days[0]}: ${time}`);
          } else {
            resultLines.push(time);
          }
        }
        return resultLines.join('\n');
      };

      const generateFormattedHashtags = () => {
        const titleList = extractWords(formData.titleKeyword);
        const bodyList = extractWords(formData.bodyKeyword);
        const userTagList = extractWords(formData.hashtags);

        const combinedTags = [...titleList, ...bodyList, ...userTagList]
          .map(tag => tag.startsWith('#') ? tag : `#${tag}`)
          .filter(tag => tag.length > 1 && tag !== '#협찬' && tag !== '#오늘클립챌린지');

        const uniqueTags = Array.from(new Set(combinedTags));

        let prefixTags = [];
        if (platform === 'instagram') prefixTags = ['#협찬'];
        else if (platform === 'clip') prefixTags = ['#협찬', '#오늘클립챌린지'];

        const allFinalTags = [...prefixTags, ...uniqueTags];
        if (allFinalTags.length === 0) return '';

        let lines = [];
        for (let i = 0; i < allFinalTags.length; i += 5) {
          lines.push(allFinalTags.slice(i, i + 5).join(' '));
        }
        return lines.join('\n');
      };

      // 🌟 입력된 다양한 키워드를 조합하는 개선된 SEO 사진 파일명 생성 로직
      const generatePhotoNamesArray = () => {
        const cleanStr = (str) => str ? str.trim().replace(/[\s,]+/g, '_') : '';
        const store = cleanStr(formData.storeName) || '장소명';

        const titleKws = extractWords(formData.titleKeyword).map(cleanStr);
        const bodyKws = extractWords(formData.bodyKeyword).map(cleanStr);
        const allKeywords = Array.from(new Set([...titleKws, ...bodyKws]));

        // 순차적으로 다양한 키워드를 가져오기 위한 유틸리티
        const getKw = (idx, fallback) => allKeywords[idx] || titleKws[0] || bodyKws[0] || fallback;

        let photoList = [];

        if (category === 'restaurant') {
          const menus = extractWords(formData.menu).map(cleanStr);
          const menu1 = menus[0] || '대표메뉴';
          const menu2 = menus[1] || getKw(1, '인기메뉴');

          photoList = [
            `01_${store}_${getKw(0, '맛집추천')}_${menu1}_대표썸네일.png`,
            `02_${store}_${getKw(1, '매장안내')}_외관전경_간판.png`,
            `03_${store}_${getKw(2, '분위기맛집')}_내부인테리어.png`,
            `04_${store}_${getKw(3, '메뉴판정보')}_가격정보.png`,
            `05_${store}_${menu1}_${getKw(4, '솔직후기')}_메인요리전체.png`,
            `06_${store}_${menu2}_${getKw(5, '맛도리')}_디테일클로즈업.png`,
            `07_${store}_${getKw(6, '재방문의사')}_방문총평마무리.png`
          ];
        } else if (category === 'visit') {
          const purpose = cleanStr(formData.purpose) || getKw(1, '핫플추천');

          photoList = [
            `01_${store}_${getKw(0, '가볼만한곳')}_${purpose}_대표썸네일.png`,
            `02_${store}_${getKw(1, '위치안내')}_입구전경.png`,
            `03_${store}_${getKw(2, '데이트코스')}_내부시설.png`,
            `04_${store}_${getKw(3, '인생샷포인트')}_메인포토존.png`,
            `05_${store}_${getKw(4, '체험후기')}_디테일컷.png`,
            `06_${store}_${getKw(5, '방문꿀팁')}_현장컷.png`,

        } else if (category === 'hotel') {

          const amenity = cleanStr(formData.amenities.split(',')[0]) || '부대시설';

          photoList = [
            `01_${store}_${getKw(0, '호캉스추천')}_${room}_대표썸네일.png`,
            `02_${store}_${getKw(1, '숙소위치')}_외관로비.png`,
            `03_${store}_${room}_${getKw(2, '객실인테리어')}_침실전경.png`,
            `04_${store}_${room}_${getKw(3, '룸컨디션')}_욕실어메니티.png`,
            `05_${store}_${amenity}_${getKw(4, '부대시설후기')}.png`,

        } else { // product
          const pName = cleanStr(formData.productName) || '제품명';

          photoList = [
            `01_${store}_${pName}_${getKw(0, '제품추천')}_대표썸네일.png`,
            `02_${store}_${pName}_${getKw(1, '언박싱')}_패키지.png`,
            `03_${pName}_${getKw(2, '솔직리뷰')}_본품디테일.png`,
            `04_${pName}_${getKw(3, '성분제형')}_사용감.png`,
            `05_${pName}_${getKw(4, '사용법')}_비포애프터.png`,

            `07_${store}_${pName}_${getKw(6, '총평후기')}_마무리.png`

        }
        return photoList;
      };

      const generateFriendlyCommentsText = () => {
        const store = formData.storeName ? formData.storeName.trim() : (formData.productName ? formData.productName.trim() : '여기');
        let pool = [];

        if (category === 'restaurant') {
          pool = [
            `우와 ${store} 분위기 진짜 대박이네요...✨ 보자마자 반해서 바로 저장했어요!! 사진 느낌도 너무 좋구 취향저격이라 자주 소통하면서 지내고 싶어요 💖 오늘 하루도 맛있는 거 많이 드시구 행복하세요~🥰`,
            `비주얼 미쳤다 진짜 🥹 실례가 안 된다면 종종 놀러 와서 맛집 정보 얻어가도 될까요?! 사진 감성이 너무 예뻐서 보자마자 들어왔어요 ㅎㅎ 자주 소통해요 우리! 👀✨`,
            `피드 구경하다가 음식 맛깔나 보이는 포스팅에 한참 머물다 가요~ 히히 💕 올려주신 후기 잘 보고 갑니다! 앞으로 맛난 정보 나누면서 친하게 지내요 🥰`,
            `${store} 메뉴 대박이네요 🤤 사진 표현이 너무 완벽해서 배고파졌어요!! 종종 와서 소통하고 좋은 곳 정보 받아갈게요 💖`,
            `분위기도 좋고 가보고 싶어지네요 ✨ 사진 감성에 반해서 들어왔는데 앞으로 자주 소통하며 지내면 좋겠습니다 🥰 행복한 하루 보내세요!`

        } else if (category === 'visit') {
          pool = [
            `우와 ${store} 진짜 예쁘게 잘 나오네요...✨ 보자마자 반해서 바로 장소 저장했어요!! 사진 느낌도 너무 좋구 취향저격이라 자주 소통하며 지내고 싶어요 💖 즐거운 하루 보내세요~🥰`,
            `감성 미쳤다 진짜 🥹 실례가 안 된다면 종종 놀러 와서 핫플 정보 얻어가도 될까요?! 사진 느낌이 완벽해서 홀린 듯 들어왔어요 ㅎㅎ 자주 소통해요 우리! 👀✨`,
            `피드 구경하다가 분위기가 너무 예뻐서 한참 머물다 가요~ 히히 💕 포스팅 너무 잘 보고 갑니다! 앞으로 예쁜 정보 나누면서 친하게 지내요 🥰`,
            `와 여기 꼭 가봐야겠어요 ✨ 사진을 너무 감성 있게 잘 찍으셔서 보는 내내 힐링했어요! 앞으로 소통하면서 친하게 지내요 💖`,
            `핫플 정보 너무 감사해요 👀 피드 감성이 너무 제 스타일이라 한참 구경했어요 ㅎㅎ 자주 소통하며 알고 지내요 🥰`
          ];
        } else if (category === 'hotel') {
          pool = [
            `우와 ${store} 숙소 분위기 진짜 대박이네요...✨ 보자마자 반해서 다음 여행지로 저장했어요!! 감성도 너무 좋구 취향저격이라 자주 소통하며 지내고 싶어요 💖 오늘도 행복하세요~🥰`,
            `뷰랑 인테리어 미쳤다 진짜 🥹 실례가 안 된다면 종종 놀러 와서 숙소 정보 얻어가도 될까요?! 감성이 너무 취향이라 들어왔어요 ㅎㅎ 자주 소통해요 우리! 👀✨`,
            `피드 구경하다가 힐링 포스팅에 한참 머물다 가요~ 히히 💕 예쁜 정보 잘 보고 갑니다! 앞으로 꿀정보 나누면서 친하게 지내요 🥰 편안한 밤 되세요!!`,
            `여기 정말 대박이네요 🌿 보는 것만으로도 힐링 되는 기분이에요! 앞으로 자주 놀러 와서 소통할게요 💖`,
            `인테리어가 완전 취향저격이에요 ✨ 올려주신 후기 덕분에 좋은 곳 알고 가네요! 소통하며 친하게 지내요 🥰`
          ];
        } else { // product
          pool = [
            `우와 ${store} 사용후기 진짜 꼼꼼하고 유용하네요...✨ 보자마자 반해서 포스팅 저장했어요!! 센스 넘치는 사진도 취향저격이라 소통하며 지내고 싶어요 💖 오늘도 행복하게 보내세요~🥰`,
            `정보 미쳤다 진짜 🥹 실례가 안 된다면 종종 놀러 와서 유용한 정보 얻어가도 될까요?! 사진 감성이 너무 예뻐서 들어왔어요 ㅎㅎ 자주 소통해요 우리! 👀✨`,
            `피드 구경하다가 정성스러운 리뷰에 한참 머물다 가요~ 히히 💕 올려주신 내용 잘 보고 갑니다! 앞으로 좋은 정보 공유하면서 친하게 지내요 🥰`,
            `리뷰 사진이랑 글이 너무 깔끔하고 좋네요 ✨ 꿀팁 얻어갑니다!! 소통하면서 오래오래 알고 지내고 싶어요 💖`,
            `설명이 너무 잘 되어있어서 큰 도움 됐어요 🥰 사진 감성도 너무 제 스타일이에요! 앞으로 자주 소통하며 지내요 ㅎㅎ`
          ];
        }

        const shuffled = [...pool].sort(() => 0.5 - Math.random());
        const selected = shuffled.slice(0, 3);

        return `[💬 추천 MZ 댓글 모음 (상냥한 톤)]\n1. ${selected[0]}\n2. ${selected[1]}\n3. ${selected[2]}`;
      };

      const handleGenerateDraft = () => {
        let resultText = '';
        const addField = (label, value) => value.trim() ? `${label}: ${value.trim()}\n` : `${label}:\n`;
        
        const formatKeywords = (str) => Array.from(new Set(extractWords(str))).join(', ');

          resultText += addField('위치/주소', formData.location);
          resultText += addField('영업시간', formatOperatingHours(formData.operatingHours));
          resultText += addField('가게 소개', formData.storeIntro);
          resultText += addField('찾아가는 길', formData.directions);
          resultText += addField('주차 정보', formData.parking);
          resultText += addField('예약 정보', formData.reservation);
          resultText += addField('주문한 메뉴', formData.menu);
          resultText += addField('제목 키워드', formatKeywords(formData.titleKeyword));
          resultText += addField('본문 키워드', formatKeywords(formData.bodyKeyword));
          resultText += addField('광고주 요청사항', formData.requestNote);
          resultText += addField('본문소스', formData.bodySource);
          resultText += addField('지도/포스팅 링크', formData.link);
        } else if (category === 'visit') {
          resultText += addField('장소명', formData.storeName);
          resultText += addField('위치/주소', formData.location);
          resultText += addField('영업시간/운영시간', formatOperatingHours(formData.operatingHours));
          resultText += addField('장소 소개', formData.storeIntro);
          resultText += addField('찾아가는 길', formData.directions);
          resultText += addField('주차 정보', formData.parking);
          resultText += addField('예약/입장 정보', formData.reservation);
          resultText += addField('방문 목적/특징', formData.purpose);
          resultText += addField('제목 키워드', formatKeywords(formData.titleKeyword));
          resultText += addField('본문 키워드', formatKeywords(formData.bodyKeyword));
          resultText += addField('광고주 요청사항', formData.requestNote);
          resultText += addField('본문소스', formData.bodySource);
          resultText += addField('관련 링크', formData.link);
        } else if (category === 'hotel') {
          resultText += addField('숙소명', formData.storeName);
          resultText += addField('위치/지역', formData.location);
          resultText += addField('룸 타입/체크인·아웃', formData.roomType);
          resultText += addField('부대시설/조식 정보', formData.amenities);
          resultText += addField('제목 키워드', formatKeywords(formData.titleKeyword));
          resultText += addField('본문 키워드', formatKeywords(formData.bodyKeyword));
          resultText += addField('광고주 요청사항', formData.requestNote);
          resultText += addField('본문소스', formData.bodySource);
          resultText += addField('예약/삽입 링크', formData.link);
        }

        const finalHashtags = generateFormattedHashtags();
        if (finalHashtags) resultText += `\n[해시태그]\n${finalHashtags}\n`;
        resultText += `\n${generateFriendlyCommentsText()}\n`;

        setGeneratedResult(resultText);
        setGeneratedPhotoList(generatePhotoNamesArray());
        setFormData(initialFormState);
      };

      const handleCopyAndSave = async () => {
        if (!generatedResult) {
          alert('먼저 초안을 등록해 주세요!');
          return;
        }

        navigator.clipboard?.writeText(generatedResult);

        const newPost = {
          id: Date.now(),
          platform,
          category,
          title: formData.storeName || formData.productName || '제목 없음',
          content: generatedResult,
          photoNames: generatedPhotoList, // 🌟 이미지 파일명을 독립 항목으로 분리 저장
          date: new Date().toLocaleDateString('ko-KR')
        };

        await savePostToFirebase(newPost);
        alert('초안 복사 및 서버 저장 완료! (추천 이미지 파일명은 별도 칸에 자동 보관되었습니다 🧚‍)');
      };

      const handleCopySavedItem = (text) => {
        navigator.clipboard?.writeText(text);
        alert('해당 초안 본문이 복사되었습니다!');
      };

      const handleDeleteSavedItem = async (id) => {
        if (confirm('정말 삭제하시겠습니까?')) {
          await deletePostFromFirebase(id);
        }
      };

      const handleUpdateSavedContent = async (id, updatedText, updatedPhotos) => {
        const targetPost = savedPosts.find(p => p.id === id);
        if (targetPost) {
          const updated = { ...targetPost, content: updatedText, photoNames: updatedPhotos };
          await savePostToFirebase(updated);
          alert('수정 사항이 실시간 저장되었습니다!');
        }
      };

      // 팔로우 통계 기록 Firebase 저장
      const handleAddFollowRecord = async () => {
        if (!inputFollower || !inputFollowing) {
          alert('팔로워 수와 팔로잉 수를 정확히 입력해 주세요!');
          return;
        }

        const newRecord = {
          id: Date.now(),
          date: inputDate,
          followers: Number(inputFollower),
          following: Number(inputFollowing)
        };

        if (window.db && window.dbFunctions) {
          const { doc, setDoc } = window.dbFunctions;
          try {
            await setDoc(doc(window.db, "followStats", String(newRecord.id)), newRecord);
            setInputFollower('');
            setInputFollowing('');
            alert(`${inputDate} 수치 기록 완료! 🧚‍`);
          } catch (e) {
            console.error("통계 저장 실패:", e);
          }
        }
      };

      const handleDeleteFollowRecord = async (id) => {
        if (confirm('해당 날짜의 통계 기록을 삭제하시겠습니까?')) {
          if (window.db && window.dbFunctions) {
            const { doc, deleteDoc } = window.dbFunctions;
            try {
              await deleteDoc(doc(window.db, "followStats", String(id)));
            } catch (e) {
              console.error("통계 삭제 실패:", e);
            }
          }
        }
      };

      const getPeriodStats = () => {
        if (followHistory.length === 0) return null;

        const latest = followHistory[0];
        const latestDate = new Date(latest.date);
        
        let targetDays = 6;
        let periodName = '주간';
        if (statsPeriod === 'month') {
          targetDays = 28;
          periodName = '월간';
        } else if (statsPeriod === 'year') {
          targetDays = 360;
          periodName = '연간';
        }

        const previousRecord = followHistory.find(item => {
          const diffDays = (latestDate - new Date(item.date)) / (1000 * 60 * 60 * 24);
          return diffDays >= targetDays;
        }) || followHistory[followHistory.length - 1];

        const diffDays = Math.max(1, Math.round((latestDate - new Date(previousRecord.date)) / (1000 * 60 * 60 * 24)));
        const followerDiff = latest.followers - previousRecord.followers;
        const followingDiff = latest.following - previousRecord.following;
        const growthRate = previousRecord.followers > 0 
          ? ((followerDiff / previousRecord.followers) * 100).toFixed(1) 
          : '0.0';

        return {
          latest,
          previousRecord,
          periodName,
          diffDays,
          followerDiff,
          followingDiff,
          growthRate
        };
      };

      const getFilteredChartData = () => {
        if (followHistory.length === 0) return [];

        const sortedAsc = [...followHistory].sort((a, b) => new Date(a.date) - new Date(b.date));
        const latestDate = new Date(sortedAsc[sortedAsc.length - 1].date);

        if (statsPeriod === 'week') {
          return sortedAsc.filter(item => (latestDate - new Date(item.date)) / (1000 * 60 * 60 * 24) <= 7);
        } else if (statsPeriod === 'month') {
          return sortedAsc.filter(item => (latestDate - new Date(item.date)) / (1000 * 60 * 60 * 24) <= 30);
        } else if (statsPeriod === 'year') {
          return sortedAsc.filter(item => (latestDate - new Date(item.date)) / (1000 * 60 * 60 * 24) <= 365);
        }
        return sortedAsc;
      };

      const periodStats = getPeriodStats();
      const chartData = getFilteredChartData();

      const filteredPosts = savedPosts.filter(item => {
        const matchesFilter = listFilter === 'all' || item.platform === listFilter;
        const matchesSearch = searchQuery.trim() === '' || 
          item.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
          item.content.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesFilter && matchesSearch;
      });

      const categoryNames = { product: '제품리뷰', restaurant: '맛집', visit: '방문/장소', hotel: '호텔/숙소' };
      const platformNames = { blog: '📝 블로그', instagram: '📸 인스타', clip: '🎬 클립' };

      return (
        <div class="max-w-3xl mx-auto space-y-4">

          <div class="flex gap-2 bg-gray-200 p-1 rounded-xl text-xs sm:text-sm">
            <button
              onClick={() => setActiveTab('editor')}
              class={`flex-1 py-3 font-bold rounded-lg transition ${activeTab === 'editor' ? 'bg-slate-800 text-white' : 'text-gray-600 hover:bg-gray-300'}`}
            >
              ✍️ 초안 작성
            </button>
            <button
              onClick={() => setActiveTab('list')}
              class={`flex-1 py-3 font-bold rounded-lg transition ${activeTab === 'list' ? 'bg-slate-800 text-white' : 'text-gray-600 hover:bg-gray-300'}`}
            >
              📂 저장 목록 ({savedPosts.length})
            </button>
            <button
              onClick={() => setActiveTab('stats')}
              class={`flex-1 py-3 font-bold rounded-lg transition ${activeTab === 'stats' ? 'bg-indigo-700 text-white' : 'text-gray-600 hover:bg-gray-300'}`}
            >
              📊 팔로우 통계
            </button>
          </div>

          {activeTab === 'editor' && (
            <div class="space-y-4">
              <div class="flex justify-between items-center text-xs text-gray-500 bg-white px-4 py-2 rounded-lg shadow-sm">
                <span>
                  ⏱️ 작성 내용 임시저장: {lastAutoSaveTime ? `${lastAutoSaveTime} 저장됨` : '작성 중...'}
                </span>
                <button

                </button>

                <div class="flex gap-2">
                  {[
                    { key: 'instagram', label: '📸 인스타' },
                    { key: 'blog', label: '📝 블로그' },
                    { key: 'clip', label: '🎬 클립' }
                  ].map(item => (
                    <button
                      key={item.key}
                      onClick={() => setPlatform(item.key)}
                      class={`flex-1 py-2 text-sm font-bold rounded-lg transition ${platform === item.key ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-600'}`}
                    >
                      {item.label}
                    </button>
                  ))}
                </div>
              </div>

              <div class="bg-white p-4 rounded-xl shadow-sm">
                <div class="text-xs font-bold text-gray-500 mb-2">2. 카테고리 선택</div>
                <div class="flex gap-2">
                  {[
                    { key: 'product', label: '🛍️ 제품리뷰' },
                    { key: 'restaurant', label: '🍕 맛집' },
                    { key: 'visit', label: '📍 방문/장소' },
                    { key: 'hotel', label: '🏨 호텔/숙소' }
                  ].map(item => (
                    <button
                      key={item.key}
                      onClick={() => setCategory(item.key)}
                      class={`flex-1 py-2 text-xs font-bold rounded-lg transition ${category === item.key ? 'bg-slate-700 text-white' : 'bg-gray-100 text-gray-600'}`}
                    >
                      {item.label}
                    </button>
                  ))}
                </div>
              </div>

              <div class="bg-white p-4 rounded-xl shadow-sm space-y-3">
                <div class="text-sm font-bold text-slate-800 border-b pb-2">📝 상세 내용 입력</div>

                <div>
                  <label class="text-xs font-semibold text-gray-500 block mb-1">상호명 / 장소명 / 숙소명</label>
                  <input
                    type="text"
                    placeholder="상호명 입력"
                    value={formData.storeName}
                    onChange={e => handleChange('storeName', e.target.value)}
                    class="w-full border rounded-lg p-2.5 text-sm bg-gray-50 focus:bg-white focus:outline-indigo-500"
                  />
                </div>

                {category === 'product' && (
                  <div>
                    <label class="text-xs font-semibold text-gray-500 block mb-1">사용 제품명</label>
                    <input
                      type="text"
                      placeholder="예: 클렌징폼 100ml"
                      value={formData.productName}
                      onChange={e => handleChange('productName', e.target.value)}
                      class="w-full border rounded-lg p-2.5 text-sm bg-gray-50 focus:bg-white focus:outline-indigo-500"

                {(category === 'restaurant' || category === 'visit' || category === 'hotel') && (

                    <input

                {(category === 'restaurant' || category === 'visit') && (
                  <>
                    <div>
                      <label class="text-xs font-semibold text-gray-500 block mb-1">영업시간 / 운영시간 (네이버지도 복사 붙여넣기)</label>
                      <textarea

                        class="w-full border rounded-lg p-2.5 text-sm bg-gray-50 focus:bg-white focus:outline-indigo-500"

                    <div>
                      <label class="text-xs font-semibold text-gray-500 block mb-1">가게 / 장소 소개</label>

                        type="text"

                        onChange={e => handleChange('storeIntro', e.target.value)}

                      />
                    </div>
                    <div>

                      <input
                        type="text"
                        placeholder="예: 건물 지하 주차장 2시간 무료"

                        onChange={e => handleChange('parking', e.target.value)}

                    <label class="text-xs font-semibold text-gray-500 block mb-1">방문 목적 / 특징</label>
                    <input
                      type="text"
                      placeholder="예: 데이트코스 추천, 아이와 가볼만한 곳"

                    />

                {category === 'hotel' && (
                  <>
                    <div>
                      <label class="text-xs font-semibold text-gray-500 block mb-1">룸 타입 / 체크인·아웃</label>
                      <input
                        type="text"
                        placeholder="예: 디럭스 킹 / 15:00 ~ 11:00"

                        class="w-full border rounded-lg p-2.5 text-sm bg-gray-50 focus:bg-white focus:outline-indigo-500"
                      />
                    </div>
                  </>
                )}

                <div>
                  <label class="text-xs font-semibold text-gray-500 block mb-1">제목 키워드 (띄어쓰기 또는 쉼표 구분)</label>
                  <input
                    type="text"
                    placeholder="예: 강남역맛집 데이트코스 분위기맛집"
                    value={formData.titleKeyword}
                    onChange={e => handleChange('titleKeyword', e.target.value)}
                    class="w-full border rounded-lg p-2.5 text-sm bg-gray-50 focus:bg-white focus:outline-indigo-500"
                  />
                </div>

                <div>
                  <label class="text-xs font-semibold text-gray-500 block mb-1">본문 키워드 (띄어쓰기 또는 쉼표 구분)</label>
                  <input
                    type="text"

                    onChange={e => handleChange('requestNote', e.target.value)}
                    class="w-full border rounded-lg p-2.5 text-sm bg-gray-50 focus:bg-white focus:outline-indigo-500"

                <div>

                  />
                </div>

                    class="w-full border rounded-lg p-2.5 text-sm bg-gray-50 focus:bg-white focus:outline-indigo-500"
                  />
                </div>

                <div>
                  <label class="text-xs font-semibold text-gray-500 block mb-1">포스팅 삽입 링크</label>
                  <input
                    type="text"
                    placeholder="https://..."
                    value={formData.link}
                    onChange={e => handleChange('link', e.target.value)}
                    class="w-full border rounded-lg p-2.5 text-sm bg-gray-50 focus:bg-white focus:outline-indigo-500"
                  />
                </div>

                <button
                  onClick={handleGenerateDraft}
                  class="w-full py-3.5 bg-slate-700 hover:bg-slate-800 text-white font-bold rounded-lg transition mt-4"
                >
                  ✨ 초안 등록 및 양식 생성
                </button>
              </div>

              {generatedResult && (
                <div class="bg-white p-4 rounded-xl shadow-sm space-y-4 border-2 border-indigo-100">
                  <div class="text-sm font-bold text-slate-800">📋 생성된 초안 양식 (본문)</div>
                  <textarea
                    rows="10"
                    readOnly
                    value={generatedResult}
                    class="w-full border rounded-lg p-3 text-xs bg-slate-50 text-slate-800 font-mono resize-y"
                  />

                  {/* 🌟 추천 이미지 파일명 전용 구역 */}
                  {generatedPhotoList.length > 0 && (
                    <div class="bg-indigo-50/70 border border-indigo-200 rounded-xl p-3.5 space-y-2">
                      <div class="text-xs font-bold text-indigo-950 flex items-center justify-between">
                        <span class="flex items-center gap-1">📷 네이버 SEO 추천 이미지 파일명 (다양한 키워드 조합)</span>
                        <span class="text-[11px] font-normal text-indigo-600">독립 항목으로 보관됩니다</span>
                      </div>
                      <div class="space-y-1.5">
                        {generatedPhotoList.map((photoName, idx) => (
                          <div key={idx} class="flex items-center justify-between bg-white px-3 py-1.5 rounded-lg border border-indigo-100 text-xs">
                            <span class="font-mono text-gray-700 truncate">{photoName}</span>
                            <button
                              onClick={() => {
                                navigator.clipboard?.writeText(photoName);
                                alert(`파일명이 복사되었습니다:\n${photoName}`);
                              }}
                              class="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded text-[11px] shrink-0 ml-2 transition"
                            >
                              📋 복사
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  <button
                    onClick={handleCopyAndSave}
                    class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg transition"
                  >
                    📋 초안 복사 및 서버 저장하기
                  </button>
                </div>
              )}
            </div>
          )}

          {activeTab === 'list' && (
            <div class="bg-white p-4 rounded-xl shadow-sm space-y-4">
              <div class="text-sm font-bold text-slate-800">📂 저장된 초안 목록 (실시간 공유)</div>

              <input
                type="text"
                placeholder="🔍 상호명, 제품명, 키워드로 검색..."
                value={searchQuery}
                onChange={e => setSearchQuery(e.target.value)}
                class="w-full border-2 border-slate-600 rounded-lg p-2.5 text-sm"
              />

              <div class="flex gap-1.5">
                {[
                  { key: 'all', label: '전체' },
                  { key: 'instagram', label: '인스타' },
                  { key: 'blog', label: '블로그' },
                  { key: 'clip', label: '클립' }
                ].map(item => (
                  <button
                    key={item.key}
                    onClick={() => setListFilter(item.key)}
                    class={`flex-1 py-1.5 text-xs font-semibold rounded ${listFilter === item.key ? 'bg-slate-600 text-white' : 'bg-gray-100 text-gray-600'}`}
                  >
                    {item.label}
                  </button>
                ))}
              </div>

              {filteredPosts.length === 0 ? (
                <div class="text-center py-10 text-gray-400 text-sm">저장된 초안이 없습니다. 🧚‍</div>
              ) : (
                <div class="space-y-3">
                  {filteredPosts.map(item => (
                    <SavedItemCard
                      key={item.id}
                      item={item}
                      platformNames={platformNames}
                      categoryNames={categoryNames}
                      onCopy={handleCopySavedItem}
                      onDelete={handleDeleteSavedItem}
                      onUpdate={handleUpdateSavedContent}
                    />
                  ))}
                </div>
              )}
            </div>
          )}

          {/* 📊 팔로우 통계 탭 화면 */}
          {activeTab === 'stats' && (
            <div class="space-y-4">
              <div class="bg-white p-4 rounded-xl shadow-sm space-y-3">
                <div class="text-sm font-bold text-slate-800 border-b pb-2 flex items-center justify-between">
                  <span>📈 팔로워 / 팔로잉 수치 기록</span>
                  <span class="text-xs font-normal text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full">실시간 차트 동기화</span>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                  <div>
                    <label class="text-xs font-semibold text-gray-500 block mb-1">기록 날짜</label>
                    <input
                      type="date"
                      value={inputDate}
                      onChange={e => setInputDate(e.target.value)}
                      class="w-full border rounded-lg p-2 text-xs bg-gray-50 focus:bg-white focus:outline-indigo-500"
                    />
                  </div>
                  <div>
                    <label class="text-xs font-semibold text-gray-500 block mb-1">팔로워 수 (명)</label>
                    <input
                      type="number"
                      placeholder="예: 12500"
                      value={inputFollower}
                      onChange={e => setInputFollower(e.target.value)}
                      class="w-full border rounded-lg p-2 text-xs bg-gray-50 focus:bg-white focus:outline-indigo-500"
                    />
                  </div>
                  <div>
                    <label class="text-xs font-semibold text-gray-500 block mb-1">팔로잉 수 (명)</label>
                    <input
                      type="number"
                      placeholder="예: 450"
                      value={inputFollowing}
                      onChange={e => setInputFollowing(e.target.value)}
                      class="w-full border rounded-lg p-2 text-xs bg-gray-50 focus:bg-white focus:outline-indigo-500"
                    />
                  </div>
                </div>

                <button
                  onClick={handleAddFollowRecord}
                  class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-lg transition"
                >
                  ➕ 수치 기록 저장하기
                </button>
              </div>

              {periodStats && (
                <div class="bg-gradient-to-r from-indigo-900 to-slate-800 text-white p-4 rounded-xl shadow-sm space-y-3">
                  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b border-indigo-700/60 pb-2">
                    <span class="text-xs font-bold text-indigo-200">📊 {periodStats.periodName} 성과 요약 리포트</span>
                    
                    <div class="flex gap-1 bg-indigo-950/80 p-0.5 rounded-lg border border-indigo-700/50">
                      {[
                        { key: 'week', label: '1주일' },
                        { key: 'month', label: '1개월' },
                        { key: 'year', label: '1년' }
                      ].map(p => (
                        <button
                          key={p.key}
                          onClick={() => setStatsPeriod(p.key)}
                          class={`px-2.5 py-1 text-[11px] font-bold rounded transition ${
                            statsPeriod === p.key ? 'bg-indigo-500 text-white shadow' : 'text-indigo-300 hover:text-white'
                          }`}
                        >
                          {p.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div class="text-[11px] text-indigo-200/90">
                    비교 기간: {periodStats.previousRecord.date} ~ {periodStats.latest.date} ({periodStats.diffDays}일간)
                  </div>

                  <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 pt-1">
                    <div class="bg-white/10 p-3 rounded-lg backdrop-blur-sm">
                      <div class="text-[11px] text-gray-300">현재 팔로워</div>
                      <div class="text-lg font-bold mt-0.5">{periodStats.latest.followers.toLocaleString()}명</div>
                      <div class={`text-xs font-semibold mt-1 ${periodStats.followerDiff >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                        {periodStats.followerDiff >= 0 ? `▲ +${periodStats.followerDiff.toLocaleString()}` : `▼ ${periodStats.followerDiff.toLocaleString()}`}명
                      </div>
                    </div>

                    <div class="bg-white/10 p-3 rounded-lg backdrop-blur-sm">
                      <div class="text-[11px] text-gray-300">{periodStats.periodName} 성장률</div>
                      <div class="text-lg font-bold mt-0.5">{periodStats.growthRate}%</div>
                      <div class="text-[10px] text-indigo-200 mt-1">이전 수치 대비 변동</div>
                    </div>

                    <div class="bg-white/10 p-3 rounded-lg backdrop-blur-sm col-span-2 sm:col-span-1">
                      <div class="text-[11px] text-gray-300">팔로잉 변동</div>
                      <div class="text-lg font-bold mt-0.5">{periodStats.latest.following.toLocaleString()}명</div>
                      <div class={`text-xs font-semibold mt-1 ${periodStats.followingDiff >= 0 ? 'text-indigo-300' : 'text-amber-300'}`}>
                        {periodStats.followingDiff >= 0 ? `▲ +${periodStats.followingDiff.toLocaleString()}` : `▼ ${periodStats.followingDiff.toLocaleString()}`}명
                      </div>
                    </div>
                  </div>
                </div>
              )}

              <FollowerBarChart data={chartData} />

              <div class="bg-white p-4 rounded-xl shadow-sm space-y-3">
                <div class="text-sm font-bold text-slate-800 border-b pb-2">📜 팔로우 기록 히스토리</div>

                {followHistory.length === 0 ? (
                  <div class="text-center py-8 text-gray-400 text-xs">
                    아직 등록된 수치 기록이 없습니다. 상단에서 날짜별 팔로워/팔로잉을 등록해 보세요! 🧚‍
                  </div>
                ) : (
                  <div class="space-y-2 max-h-80 overflow-y-auto pr-1">
                    {followHistory.map(item => (
                      <div key={item.id} class="flex justify-between items-center bg-gray-50 p-2.5 rounded-lg border text-xs">
                        <div class="flex items-center gap-3">
                          <span class="font-bold text-slate-700 font-mono">{item.date}</span>
                          <span class="text-gray-600">
                            팔로워 <strong class="text-indigo-600">{item.followers.toLocaleString()}</strong>명
                          </span>
                          <span class="text-gray-400">|</span>
                          <span class="text-gray-600">
                            팔로잉 <strong>{item.following.toLocaleString()}</strong>명
                          </span>
                        </div>
                        <button
                          onClick={() => handleDeleteFollowRecord(item.id)}
                          class="text-rose-500 hover:text-rose-700 font-semibold text-[11px]"
                        >
                          삭제
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    function FollowerBarChart({ data }) {
      const canvasRef = useRef(null);
      const [tooltip, setTooltip] = useState(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);

        const width = rect.width;
        const height = rect.height;

        ctx.clearRect(0, 0, width, height);

        if (!data || data.length === 0) {
          ctx.fillStyle = '#94a3b8';
          ctx.font = '12px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('표시할 통계 데이터가 부족합니다.', width / 2, height / 2);
          return;
        }

        const padding = { top: 30, right: 20, bottom: 40, left: 50 };
        const chartWidth = width - padding.left - padding.right;
        const chartHeight = height - padding.top - padding.bottom;

        const maxFollowers = Math.max(...data.map(d => d.followers));
        const minFollowers = Math.min(...data.map(d => d.followers));
        const minVal = Math.max(0, Math.floor(minFollowers * 0.8));
        const maxVal = Math.ceil(maxFollowers * 1.05);

        ctx.strokeStyle = '#f1f5f9';
        ctx.lineWidth = 1;
        ctx.fillStyle = '#64748b';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'right';

        const ySteps = 4;
        for (let i = 0; i <= ySteps; i++) {
          const yVal = minVal + ((maxVal - minVal) / ySteps) * i;
          const yPos = padding.top + chartHeight - (chartHeight / ySteps) * i;

          ctx.beginPath();
          ctx.moveTo(padding.left, yPos);
          ctx.lineTo(width - padding.right, yPos);
          ctx.stroke();

          ctx.fillText(Math.round(yVal).toLocaleString(), padding.left - 8, yPos + 3);
        }

        const barGap = 12;
        const totalGap = barGap * (data.length + 1);
        const barWidth = Math.max(12, Math.min(36, (chartWidth - totalGap) / data.length));
        const startX = padding.left + (chartWidth - (barWidth * data.length + barGap * (data.length - 1))) / 2;

        data.forEach((item, index) => {
          const x = startX + index * (barWidth + barGap);
          const valRatio = (item.followers - minVal) / (maxVal - minVal || 1);
          const barH = Math.max(6, chartHeight * valRatio);
          const y = padding.top + chartHeight - barH;

          const gradient = ctx.createLinearGradient(0, y, 0, y + barH);
          gradient.addColorStop(0, '#6366f1');
          gradient.addColorStop(1, '#818cf8');

          ctx.fillStyle = gradient;
          ctx.beginPath();
          if (ctx.roundRect) {
            ctx.roundRect(x, y, barWidth, barH, [4, 4, 0, 0]);
          } else {
            ctx.rect(x, y, barWidth, barH);
          }
          ctx.fill();

          const dateStr = item.date.slice(5).replace('-', '/');
          ctx.fillStyle = '#64748b';
          ctx.font = '10px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(dateStr, x + barWidth / 2, height - padding.bottom + 16);

          item._x = x;
          item._y = y;
          item._w = barWidth;
          item._h = barH;
        });

      }, [data]);

      const handleMouseMove = (e) => {
        const canvas = canvasRef.current;
        if (!canvas || !data) return;
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        const hovered = data.find(item => 
          mouseX >= item._x && mouseX <= item._x + item._w &&
          mouseY >= item._y && mouseY <= item._y + item._h
        );

        if (hovered) {
          setTooltip({
            x: hovered._x + hovered._w / 2,
            y: hovered._y - 10,
            item: hovered
          });
        } else {
          setTooltip(null);
        }
      };

      return (
        <div class="bg-white p-4 rounded-xl shadow-sm space-y-2">
          <div class="text-sm font-bold text-slate-800 border-b pb-2 flex justify-between items-center">
            <span>📊 팔로워 수치 추이 (막대 그래프)</span>
            <span class="text-[11px] font-normal text-gray-400">마우스를 올리면 세부 수치가 표시됩니다</span>
          </div>

          <div class="relative w-full h-56">
            <canvas
              ref={canvasRef}
              onMouseMove={handleMouseMove}
              onMouseLeave={() => setTooltip(null)}
              class="w-full h-full cursor-pointer"
            />

            {tooltip && (
              <div 
                style={{ left: `${tooltip.x}px`, top: `${tooltip.y}px`, transform: 'translate(-50%, -100%)' }}
                class="absolute bg-slate-900 text-white text-[11px] p-2 rounded shadow-lg pointer-events-none z-10 space-y-0.5 whitespace-nowrap"
              >
                <div class="font-bold text-indigo-300">{tooltip.item.date}</div>
                <div>팔로워: <strong class="text-white">{tooltip.item.followers.toLocaleString()}</strong>명</div>
                <div>팔로잉: <span class="text-gray-300">{tooltip.item.following.toLocaleString()}</span>명</div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function SavedItemCard({ item, platformNames, categoryNames, onCopy, onDelete, onUpdate }) {
      const [isEditing, setIsEditing] = useState(false);
      const [editContent, setEditContent] = useState(item.content);
      const [editPhotos, setEditPhotos] = useState(item.photoNames || []);

      const handleSaveEdit = () => {
        onUpdate(item.id, editContent, editPhotos);
        setIsEditing(false);
      };

      const handleCopySingleFileName = (fileName) => {
        navigator.clipboard?.writeText(fileName);
        alert(`파일명이 복사되었습니다:\n${fileName}`);
      };

      return (
        <div class="border rounded-xl p-3.5 bg-gray-50 space-y-3">
          <div class="flex justify-between items-center text-xs">
            <span class="font-bold text-indigo-600">{platformNames[item.platform]} | {categoryNames[item.category]}</span>
            <span class="text-gray-400">{item.date}</span>
          </div>
          <div class="font-bold text-slate-800">{item.title}</div>
          
          <textarea
            rows={isEditing ? 8 : 5}
            value={editContent}
            onChange={e => setEditContent(e.target.value)}
            disabled={!isEditing}
            class={`w-full border rounded-lg p-2.5 text-xs transition resize-y overflow-auto ${
              isEditing ? 'bg-white text-slate-900 border-indigo-500 font-mono shadow-inner' : 'bg-white text-gray-700 border-gray-200'
            }`}
          />

          {/* 🌟 추천 이미지 파일명 전용 독립 칸 (본문과 완전 분리) */}
          {editPhotos && editPhotos.length > 0 && (
            <div class="bg-indigo-50/80 border border-indigo-100 rounded-lg p-3 space-y-2">
              <div class="text-xs font-bold text-indigo-900 flex items-center justify-between">
                <span>📷 독립 저장된 추천 이미지 파일명 (한 줄 복사)</span>
                <span class="text-[10px] text-indigo-500 font-normal">{editPhotos.length}개 파일명</span>
              </div>
              <div class="space-y-1 max-h-48 overflow-y-auto pr-1">
                {editPhotos.map((photoName, idx) => (
                  <div key={idx} class="flex items-center justify-between bg-white px-2.5 py-1.5 rounded border border-gray-200 text-xs">
                    <span class="font-mono text-gray-700 truncate flex-1">{photoName}</span>
                    <button
                      onClick={() => handleCopySingleFileName(photoName)}
                      class="px-2 py-0.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded text-[11px] shrink-0 ml-2 transition"
                    >
                      📋 복사
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}

          <div class="flex justify-end gap-2 pt-1">
            {isEditing ? (
              <>
                <button
                  onClick={handleSaveEdit}
                  class="px-3 py-1.5 bg-indigo-600 text-white font-bold text-xs rounded-lg hover:bg-indigo-700"
                >
                  💾 저장
                </button>
                <button
                  onClick={() => { setEditContent(item.content); setEditPhotos(item.photoNames || []); setIsEditing(false); }}
                  class="px-3 py-1.5 bg-gray-400 text-white font-bold text-xs rounded-lg hover:bg-gray-500"
                >
                  취소
                </button>
              </>
            ) : (
              <>
                <button
                  onClick={() => setIsEditing(true)}
                  class="px-3 py-1.5 bg-slate-600 text-white font-bold text-xs rounded-lg hover:bg-slate-700"
                >
                  ✏️ 수정
                </button>
                <button
                  onClick={() => onCopy(item.content)}
                  class="px-3 py-1.5 bg-emerald-600 text-white font-bold text-xs rounded-lg hover:bg-emerald-700"
                >
                  📋 초안 본문 복사
                </button>
                <button
                  onClick={() => onDelete(item.id)}
                  class="px-3 py-1.5 bg-rose-500 text-white font-bold text-xs rounded-lg hover:bg-rose-600"
                >
                  🗑️ 삭제
                </button>
              </>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
